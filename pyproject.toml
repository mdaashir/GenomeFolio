[project]
name = "genomefolio"
version = "0.1.0"
description = "Sequence-alignment clustering of financial return patterns"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "click>=8.1",
    "numba>=0.59",
    "yfinance>=0.2.40",
]

[project.scripts]
genomefolio = "genomefolio.cli:cli"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genomefolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:no k satisfied min_cluster_size:RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["scripts/", "notebooks/"]
